manifestVersion: 1
id: hashhub-mining-hub
category: bitcoin
name: HashHub
version: "0.3.0"
tagline: One control plane for your SHA-256 miners and the coins they mine
description: >-
  HashHub watches your home miners (Bitaxe, Nexus S1, Harlo B30 and other
  AxeOS-style devices), shows hashrate, power, temperature and shares in one
  place, and repoints any miner between your own solo stratum servers
  (Bitcoin, Bitcoin Cash, and any coin you add) with one click or on a
  schedule.


  HashHub does not mine by itself and does not include a stratum server. It
  talks to the stratum servers you already run on this Umbrel, such as
  Public Pool or ckpool for Bitcoin and SoloBCH Forge for Bitcoin Cash.
  Adding a coin is a drop-in JSON manifest.


  Solo mining is a lottery. Your miners may never find a block.
developer: YOUR_NAME
website: https://github.com/YOUR_GITHUB_USER/hashhub-store
dependencies:
  - bitcoin
repo: https://github.com/YOUR_GITHUB_USER/hashhub-store
support: https://github.com/YOUR_GITHUB_USER/hashhub-store/issues
port: 8420
gallery: []
path: ""
defaultPassword: ""
releaseNotes: >-
  Hashrate, power and temperature history graphs (1 hour to 30 days) per miner
  and per coin, with uptime stats. Stored on your Umbrel for 30 days.
submitter: YOUR_NAME
submission: https://github.com/YOUR_GITHUB_USER/hashhub-store
