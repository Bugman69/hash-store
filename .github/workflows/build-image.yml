name: Build HashHub image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read version
        id: v
        run: echo "version=$(grep '^version:' hashhub-mining-hub/umbrel-app.yml | tr -d '\"' | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Lowercase owner (ghcr.io rejects uppercase)
        id: o
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: hashhub-mining-hub/hub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.o.outputs.owner }}/hashhub-mining-hub:${{ steps.v.outputs.version }}
